<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نمونهٔ ویجت قیمت ارز EZRate</title>
  <style>body{font-family:Tahoma,sans-serif;max-width:900px;margin:30px auto;padding:0 16px}h2{font-size:16px;margin:28px 0 8px}</style>
</head>
<body>
  <h1>نمونهٔ ویجت‌های EZRate</h1>
  <p>YOUR_WIDGET_ID را با شناسهٔ ویجتی که در ezrate.me › ویجت‌ساز ساخته‌اید عوض کنید.</p>

  <h2>فارسی، به تومان</h2>
  <div class="ezrate-widget" data-ezrate="YOUR_WIDGET_ID" data-lang="fa" data-currency="irt">
    <a href="https://ezrate.me/fa" title="قیمت ارز">قیمت ارز — EZRate</a>
  </div>

  <h2>English, in US dollars (same widget)</h2>
  <div class="ezrate-widget" data-ezrate="YOUR_WIDGET_ID" data-lang="en" data-currency="usd">
    <a href="https://ezrate.me/en" title="Iran exchange rates">Iran exchange rates — EZRate</a>
  </div>

  <h2>Türkçe, Türk lirası</h2>
  <div class="ezrate-widget" data-ezrate="YOUR_WIDGET_ID" data-lang="tr" data-currency="try">
    <a href="https://ezrate.me/en" title="İran döviz kurları">İran döviz kurları — EZRate</a>
  </div>

  <!-- once per page -->
  <script src="https://ezrate.me/widget.js" async></script>
</body>
</html>
